<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkfish</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/viewer.css" />
    <link rel="stylesheet" href="/src/styles/chrome.css" />
    <link rel="stylesheet" href="/src/styles/project.css" />
    <script type="module" src="/src/project.ts" defer></script>
  </head>
  <body>
    <!--
      プロジェクトウィンドウのガワ。左にツリーペイン、右にタブ。
      中身 (DocumentViewer) はタブごとに 1 つ、.ink-tabpanes の中に
      ProjectShell がマウントする。共通のクローム部品 (検索バー・設定・
      トースト・ウィンドウ切替) は単一文書ウィンドウと同じものを使う。
    -->

    <header class="ink-toolbar">
      <!-- 上段。deep なのでここを掴むとウィンドウが動く
           (button 等のクリック可能要素は Tauri が自動で除外する) -->
      <div class="ink-tb-top" data-tauri-drag-region="deep">
        <button data-act="toggle-pane" class="ink-tb-btn" title="ツリーを表示 / 隠す (⌘⌥B)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6.2 3v10"/></svg>
        </button>
        <div class="ink-tb-spacer"></div>

        <!-- ディレクトリのパス。押すと開いているウィンドウとタブの一覧が出る -->
        <button class="ink-capsule" aria-haspopup="listbox" aria-expanded="false" title="開いているウィンドウ">
          <span class="ink-folder-icon" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5v-7z"/></svg>
          </span>
          <span class="ink-filename"></span>
          <span class="ink-caret" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l4 4 4-4"/></svg>
          </span>
        </button>

        <div class="ink-tb-actions">
          <button data-act="edit" class="ink-tb-btn hidden" title="エディタで開く (⌘E)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5l2 2L5 13l-2.7.7L3 11l8.5-8.5z"/></svg>
          </button>
          <button data-act="open" class="ink-tb-btn" title="ファイルを開く (⌘O)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 2H4.5A1.5 1.5 0 0 0 3 3.5v9A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5V5.8L9.2 2z"/><path d="M9 2.2v3.1a.5.5 0 0 0 .5.5h3.2"/></svg>
          </button>
          <button data-act="open-dir" class="ink-tb-btn" title="フォルダを開く (⌘⇧O)">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5v-7z"/></svg>
          </button>
          <button data-act="settings" class="ink-tb-btn" aria-expanded="false" title="エディタ設定">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6L11 5M5 11l-1.4 1.4"/></svg>
          </button>
        </div>
      </div>

      <!-- 下段: タブ列。空き領域は deep なのでウィンドウを動かせる。
           タブ自体は role="tab" (= クリック可能) なので Tauri のドラッグ領域
           から自動で外れ、pointer イベントがこちらに届く。 -->
      <div class="ink-tabstrip" role="tablist" aria-label="開いているタブ" data-tauri-drag-region="deep"></div>
    </header>

    <!-- 開いているウィンドウとタブの一覧 -->
    <div class="ink-window-menu hidden" role="listbox" aria-label="開いているウィンドウ"></div>

    <!-- 読書プログレスバー(ツールバー下端の細いライン) -->
    <div class="ink-progress" aria-hidden="true"></div>

    <div class="ink-findbar hidden">
      <svg class="ink-find-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L14 14"/></svg>
      <input class="ink-find-input" type="text" spellcheck="false" placeholder="ページ内を検索" />
      <span class="ink-find-count">0/0</span>
      <div class="ink-find-nav">
        <button data-act="prev" class="ink-find-btn" title="前へ (⇧Enter)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>
        </button>
        <button data-act="next" class="ink-find-btn" title="次へ (Enter)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <button data-act="close" class="ink-find-btn" title="閉じる (Esc)">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </div>

    <div class="ink-settings hidden">
      <label for="ink-editor-cmd">外部エディタのコマンド</label>
      <input id="ink-editor-cmd" class="ink-editor-cmd" type="text" spellcheck="false" placeholder="code {path}" />
      <p class="ink-hint">
        {path} がファイルパスに置き換わります(省略時は末尾に付加)。<br />
        例: <code>code {path}</code> / <code>open -a "Visual Studio Code" {path}</code> / <code>subl {path}</code>
      </p>
      <button class="ink-settings-save">保存</button>
    </div>

    <div class="ink-body">
      <aside class="ink-pane">
        <div class="ink-pane-head">
          <span class="ink-pane-title">ファイル</span>
          <button data-act="refresh-tree" class="ink-pane-btn" title="ツリーを取り直す">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13.2 2.6v2.6h-2.6"/></svg>
          </button>
        </div>
        <!-- ツリーは TreePane が組む -->
        <div class="ink-tree" role="tree" aria-label="Markdown ファイル"></div>
      </aside>

      <!-- ペインの幅を変えるつまみ -->
      <div class="ink-splitter" role="separator" aria-orientation="vertical" title="幅を変える"></div>

      <div class="ink-tabpanes">
        <!-- タブごとに .ink-tabpane が入る (中に DocumentViewer) -->
        <div class="ink-empty-tabs">
          <div class="ink-drop-card">
            <div class="ink-mark">M<span>↓</span></div>
            <p class="ink-lead">左のツリーからファイルを選ぶ</p>
            <p class="ink-sub">Markdown ファイルをここにドロップしてもタブで開きます</p>
          </div>
        </div>
      </div>
    </div>

    <div class="ink-toast hidden"></div>
    <div class="ink-linkstatus hidden" aria-hidden="true"></div>
  </body>
</html>
